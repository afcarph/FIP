# One-command deployment:  docker compose up -d
#
# Brings up MySQL and the scheduler. The scheduler creates its schema on start
# and then waits for 06:00 Asia/Manila.
#
# The scraper's database is separate from the platform's on purpose: FIP's
# Laravel migrations already own a `fuel_price_history` with a different shape.
# See ../backend for the bridge that moves rows into the platform's own model.

name: fip-doe-scraper

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DOE_DB_ROOT_PASSWORD:?set DOE_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DOE_DB_NAME:-fip_doe}
      MYSQL_USER: ${DOE_DB_USER:-fip}
      MYSQL_PASSWORD: ${DOE_DB_PASSWORD:?set DOE_DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # The scraper writes a few thousand rows once a day and reads them back
      # for change detection. The default 128M buffer pool spends the run
      # reading index pages off disk.
      - --innodb-buffer-pool-size=512M
    volumes:
      - doe-db-data:/var/lib/mysql
    ports:
      # Loopback only. This database has no authentication story beyond its
      # password and no TLS; it should not be reachable from off the host.
      - "127.0.0.1:${DOE_DB_PORT:-3307}:3306"
    healthcheck:
      # --protocol=TCP because MySQL listens on a socket before it opens the
      # port, and a socket-based check reports healthy while connections from
      # other containers are still refused.
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-u", "root", "-p${DOE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DOE_DB_HOST: db
      DOE_DB_PORT: 3306
      DOE_DB_NAME: ${DOE_DB_NAME:-fip_doe}
      DOE_DB_USER: ${DOE_DB_USER:-fip}
      DOE_DB_PASSWORD: ${DOE_DB_PASSWORD:?set DOE_DB_PASSWORD in .env}
      DOE_DASHBOARD_URL: ${DOE_DASHBOARD_URL:?set DOE_DASHBOARD_URL in .env}
      DOE_SCHEDULE_HOUR: ${DOE_SCHEDULE_HOUR:-6}
      DOE_SCHEDULE_MINUTE: ${DOE_SCHEDULE_MINUTE:-0}
      DOE_TIMEZONE: ${DOE_TIMEZONE:-Asia/Manila}
      DOE_HEADLESS: ${DOE_HEADLESS:-true}
      DOE_LOG_LEVEL: ${DOE_LOG_LEVEL:-INFO}
      DOE_LOG_JSON: ${DOE_LOG_JSON:-false}
      DOE_MAX_ATTEMPTS: ${DOE_MAX_ATTEMPTS:-3}
    volumes:
      - ./logs:/app/logs
      - ./captures:/app/captures
    # Chromium's renderer uses shared memory, and the default 64MB is not
    # enough for a dashboard this size — it crashes the tab mid-render, which
    # looks like a dashboard that never finished loading.
    shm_size: 1gb

volumes:
  doe-db-data:
