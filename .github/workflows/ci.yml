name: CI

on:
  push:
    # fip/** as well as claude/**: work branched under fip/ ran no CI at all,
    # so every merge was validated only by whatever was run locally and CI
    # first saw the code once it was already on the mainline. Validation
    # belongs before the merge, not after it.
    branches: [main, develop, 'claude/**', 'fip/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fip_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=3s --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, bcmath, intl, zip, gd, redis, pcntl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan jwt:secret --force

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: fip_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
        run: php artisan test --coverage-clover=coverage.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app

      - name: Type check
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Run tests
        run: pytest -q --cov=app --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-coverage
          path: ai-service/coverage.xml

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --prefer-offline --no-audit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.fip.ph/api/v1
        run: npm run build

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed --line-length 100 lib test

      - name: Analyse
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

      # The job above passes without any platform code, which is exactly how
      # the app stayed unbuildable while CI was green. Building an APK is what
      # actually exercises the Android shell and the plugin set.
      - name: Build a debug APK
        run: flutter build apk --debug

  ios:
    name: Mobile (iOS)
    # Needs a macOS runner: iOS builds require Xcode and CocoaPods, neither of
    # which exists on ubuntu. Kept separate from the Flutter job rather than
    # moving that one to macOS, so the cheap checks stay on the cheap runner.
    runs-on: macos-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - run: flutter pub get

      # --no-codesign: this proves the project and its plugins compile. Signing
      # needs certificates that belong in the release workflow, not in CI.
      - name: Build the iOS app
        run: flutter build ios --no-codesign

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in the release workflow.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: infra/docker/backend.Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the AI image
        uses: docker/build-push-action@v6
        with:
          context: ai-service
          file: infra/docker/ai.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: infra/docker/frontend.Dockerfile
          target: production
          push: false
          build-args: NEXT_PUBLIC_API_URL=https://api.fip.ph/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
