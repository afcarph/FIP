name: DOE PDF ingest

# Its own workflow rather than a job in ci.yml: the ingest is an independent
# service with its own language, its own dependencies and its own release
# cadence, and a change to the Laravel app should not wait on ghostscript and a
# JVM to install.
on:
  push:
    branches: [main, develop, 'claude/**', 'fip/**']
    paths:
      - 'doe-pdf-ingest/**'
      - '.github/workflows/doe-ingest.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'doe-pdf-ingest/**'
      - '.github/workflows/doe-ingest.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: doe-pdf-ingest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doe-pdf-ingest/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        # Non-blocking. The Playwright and pandas stubs are incomplete enough
        # that a strict gate here would fail on their types rather than ours;
        # the output is still worth reading on a PR.
        run: mypy --ignore-missing-imports . || true

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doe-pdf-ingest/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # camelot and tabula need system packages; the tests exercise the
      # pdfplumber path and the database, which need none. The Docker job below
      # is what proves the full extractor chain installs.
      - name: Pytest
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe-ingest-coverage
          path: doe-pdf-ingest/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: doe-pdf-ingest
          push: false
          load: true
          tags: doe-pdf-ingest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify every extractor is usable in the image
        # The one thing the test job deliberately does not cover. camelot needs
        # ghostscript and opencv's shared libraries, tabula needs a JVM, and a
        # fallback that cannot import is not a fallback — it fails on the day
        # the primary extractor stops coping with a new layout.
        run: |
          docker run --rm doe-pdf-ingest:${{ github.sha }} python -c "
          import camelot, pdfplumber, tabula
          print('camelot, pdfplumber and tabula all import')
          "

      - name: Extract the fixture end to end in the image
        # Proves the chain works on a real published document, not just that
        # the packages import.
        run: |
          docker run --rm doe-pdf-ingest:${{ github.sha }} python -c "
          from pathlib import Path
          from extractor import extract
          report = extract(Path('tests/fixtures/ncr-price-monitoring-07282026.pdf'))
          assert report.region == 'NCR', report.region
          assert len(report.areas) == 12, report.areas
          print('extracted', report.summary())
          "

      - name: Verify the entrypoint imports
        run: |
          docker run --rm doe-pdf-ingest:${{ github.sha }} \
            python -c "import pipeline, scheduler; print('entrypoint ok')"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Requires a `doe-ingest-production` environment with the secrets below.
    # Without it the job is skipped rather than failing, so a fork's CI is
    # still green.
    environment: doe-ingest-production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        if: ${{ secrets.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Pull, rebuild and restart. The schema belongs to Laravel, so the
          # migration runs with the backend deploy, not here.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/fip/doe-pdf-ingest
          git pull --ff-only
          docker compose build ingest
          docker compose up -d
          docker compose ps
          REMOTE

      - name: Report a skipped deploy
        if: ${{ secrets.DEPLOY_HOST == '' }}
        run: echo "DEPLOY_HOST is not set; skipping deployment."
