name: DOE scraper

# Its own workflow rather than a job in ci.yml: the scraper is an independent
# service with its own language, its own dependencies and its own release
# cadence, and a change to the Laravel app should not wait on a Chromium image
# to build.
on:
  push:
    branches: [main, develop, 'claude/**', 'fip/**']
    paths:
      - 'fip-doe-scraper/**'
      - '.github/workflows/doe-scraper.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'fip-doe-scraper/**'
      - '.github/workflows/doe-scraper.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fip-doe-scraper

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fip-doe-scraper/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        # Non-blocking. The Playwright and pandas stubs are incomplete enough
        # that a strict gate here would fail on their types rather than ours;
        # the output is still worth reading on a PR.
        run: mypy --ignore-missing-imports . || true

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fip-doe-scraper/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # No browser install: every test runs against captured payloads or
      # in-memory SQLite. Downloading Chromium here would add two minutes to
      # test the one part of the pipeline these tests do not cover.
      - name: Pytest
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe-scraper-coverage
          path: fip-doe-scraper/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: fip-doe-scraper
          push: false
          load: true
          tags: fip-doe-scraper:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image can start a browser
        # The one thing the test job deliberately does not cover, and the
        # failure mode the Dockerfile warns about: a Playwright version in
        # requirements.txt that does not match the base image tag. It is caught
        # at run time with a clear message — in production, unless it is caught
        # here.
        run: |
          docker run --rm fip-doe-scraper:${{ github.sha }} python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(args=['--no-sandbox'])
              page = browser.new_page()
              page.set_content('<title>ok</title>')
              assert page.title() == 'ok'
              browser.close()
          print('browser starts')
          "

      - name: Verify the entrypoint imports
        run: |
          docker run --rm fip-doe-scraper:${{ github.sha }} \
            python -c "import scraper, scheduler; print('entrypoint ok')"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Requires a `doe-scraper-production` environment with the secrets below.
    # Without it the job is skipped rather than failing, so a fork's CI is
    # still green.
    environment: doe-scraper-production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy over SSH
        if: ${{ secrets.DEPLOY_HOST != '' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          # Pull, rebuild and restart. The scheduler creates its own schema on
          # start, so there is no migration step — but `create_all` only adds
          # missing tables, so a column change is a manual migration.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/fip/fip-doe-scraper
          git pull --ff-only
          docker compose build scraper
          docker compose up -d
          docker compose ps
          REMOTE

      - name: Report a skipped deploy
        if: ${{ secrets.DEPLOY_HOST == '' }}
        run: echo "DEPLOY_HOST is not set; skipping deployment."
