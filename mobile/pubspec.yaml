name: fip_mobile
description: Fuel Intelligence Platform — Flutter client for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  # Dart 3.7 introduced the tall-style formatter and Flutter 3.27 renamed the
  # *ThemeData payload classes (CardTheme -> CardThemeData); the code targets
  # both. Verified against Flutter 3.44.8 / Dart 3.10.
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State & routing ----------------------------------------------------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # --- Networking ---------------------------------------------------------
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.1

  # --- Storage & security -------------------------------------------------
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  local_auth: ^2.3.0

  # --- Maps & location ----------------------------------------------------
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Device health. Needs no permission on either platform and starts no
  # background work — it reads a value the OS already publishes.
  battery_plus: ^6.2.1

  # What the handset is, for the owner's device list. Registrations were
  # arriving named "FIP mobile" or not at all, so a person looking at their own
  # devices to revoke one could not tell two phones apart. Needs no permission
  # and reads only the model — since iOS 16 the user-assigned device name is
  # not available to an app without an entitlement, which suits us: the model
  # is what belongs in that list, not somebody's name for their phone.
  device_info_plus: ^11.2.0

  # --- Camera & OCR upload ------------------------------------------------
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # --- Notifications ------------------------------------------------------
  # firebase_core and firebase_messaging were removed. Nothing in lib/ ever
  # imported them, but Flutter registers every plugin before the first frame,
  # so FLTFirebaseMessagingPlugin reached FirebaseCore at launch, found no
  # GoogleService-Info.plist, and raised — killing the app on iOS the moment
  # its icon was tapped. Android carried the same missing config and only
  # degraded quietly, which is why the crash looked iOS-specific.
  #
  # The backend still has fcm_token and a device-registration endpoint waiting.
  # Restoring push means adding both packages back *with* the platform config
  # files and an explicit Firebase.initializeApp(), not just the dependency.
  flutter_local_notifications: ^18.0.1

  # --- UI -----------------------------------------------------------------
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lucide_icons_flutter: ^3.0.5
  google_fonts: ^6.2.1

  # --- Utilities ----------------------------------------------------------
  # flutter_localizations pins intl to whatever ships with the SDK — 0.19.x on
  # Flutter 3.24, 0.20.x on 3.3x+. A caret constraint would pin the project to a
  # single SDK line, so allow the whole compatible range.
  intl: '>=0.19.0 <0.21.0'
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  maplibre_gl: ^0.26.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
