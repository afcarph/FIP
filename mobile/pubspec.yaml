name: fip_mobile
description: Fuel Intelligence Platform — Flutter client for iOS and Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State & routing ----------------------------------------------------
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # --- Networking ---------------------------------------------------------
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.1

  # --- Storage & security -------------------------------------------------
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  local_auth: ^2.3.0

  # --- Maps & location ----------------------------------------------------
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # --- Camera & OCR upload ------------------------------------------------
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # --- Notifications ------------------------------------------------------
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # --- UI -----------------------------------------------------------------
  fl_chart: ^0.69.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lucide_icons_flutter: ^3.0.5
  google_fonts: ^6.2.1

  # --- Utilities ----------------------------------------------------------
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
