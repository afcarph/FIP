include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    # `flutter build ios` checks out Swift Package Manager dependencies under
    # build/ios/SourcePackages, and some of them ship Dart examples that do not
    # compile on their own. Without this, analysing after an iOS build reports
    # ~13,000 errors from other people's sample code.
    - 'build/**'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    # require_trailing_commas is deliberately absent: from Dart 3.7 the
    # formatter's tall style decides trailing commas itself, and the lint now
    # fights `dart format` rather than reinforcing it.
    - sort_child_properties_last
    - unawaited_futures
    - use_super_parameters
