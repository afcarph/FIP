# =============================================================================
#  Nginx — edge configuration
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The request ID is generated here and passed downstream, so a single user
    # action can be traced through Nginx, Laravel and the AI service.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log  /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    client_max_body_size 12M;      # matches the OCR upload ceiling
    client_body_timeout  30s;
    client_header_timeout 15s;
    send_timeout         30s;

    # --- compression ---------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        application/javascript application/json application/xml
        application/rss+xml font/woff font/woff2
        image/svg+xml text/css text/javascript text/plain text/xml;

    # --- rate limiting -------------------------------------------------------
    # A second layer behind Laravel's own limiter: this one stops floods
    # before they ever reach PHP.
    limit_req_zone $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m  rate=1r/s;
    limit_req_zone $binary_remote_addr zone=ocr:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # --- upstreams -----------------------------------------------------------
    upstream fip_api {
        server api:8000 max_fails=3 fail_timeout=20s;
        keepalive 32;
    }

    upstream fip_web {
        server web:3000 max_fails=3 fail_timeout=20s;
        keepalive 32;
    }

    upstream fip_ai {
        server ai-service:8001 max_fails=2 fail_timeout=30s;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
