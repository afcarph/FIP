# -----------------------------------------------------------------------------
#  Local / development server block.
#  See fip.prod.conf.example for the TLS-terminating production equivalent.
# -----------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Connection        "";

    add_header X-Request-Id $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    limit_conn conn 20;

    # --- authentication: the tightest limit ----------------------------------
    location ~ ^/api/v1/auth/(login|register|reset-password|biometric) {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://fip_api;
    }

    # --- OCR: expensive, so it gets its own bucket ---------------------------
    location = /api/v1/ocr/scan {
        limit_req zone=ocr burst=3 nodelay;
        client_max_body_size 12M;
        # A multi-pass Tesseract run can take tens of seconds.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_pass http://fip_api;
    }

    # --- AI endpoints: model latency, not web latency ------------------------
    location ~ ^/api/v1/(assistant|routes/optimize) {
        limit_req zone=api burst=10 nodelay;
        proxy_read_timeout 90s;
        proxy_pass http://fip_api;
    }

    # --- the rest of the API -------------------------------------------------
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_pass http://fip_api;
    }

    # --- AI service, internal only -------------------------------------------
    # Reachable from the private network for debugging; never from the edge.
    location /internal/ai/ {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        rewrite ^/internal/ai/(.*)$ /$1 break;
        proxy_pass http://fip_ai;
    }

    # --- Next.js static assets: immutable, so cache hard ---------------------
    location /_next/static/ {
        proxy_pass http://fip_web;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- everything else goes to the web app ---------------------------------
    location / {
        proxy_pass http://fip_web;
        proxy_read_timeout 60s;
    }

    # Health probe for the load balancer; excluded from the access log so it
    # does not drown out real traffic.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
