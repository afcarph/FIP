# =============================================================================
#  Staging overlay — adds the read replica the split is meant to use.
#
#  The base stack ships one database, so there is nothing for DB_READ_HOST to
#  point at and no way to observe replication lag. This adds a real replica so
#  the soak in docs/06 §6.8 measures replication rather than two independent
#  servers.
#
#    docker compose -f infra/docker-compose.yml \
#                   -f infra/docker-compose.staging.yml \
#                   --env-file .env up -d
#
#  Deliberately NOT production: docker-compose.prod.yml is the production
#  overlay. A managed replica (RDS read replica, Cloud SQL) is the right answer
#  there — this exists so staging can prove the application half of the design.
# =============================================================================

services:
  # The primary needs a binary log and a server id before anything can replicate
  # from it. GTID keeps the replica's position self-describing, so it can be
  # rebuilt without hunting for log coordinates.
  mysql:
    environment:
      # The official image creates root@localhost only, so the init container's
      # connection is refused with ERROR 1130. Staging-only: production uses a
      # managed replica and never needs remote root.
      MYSQL_ROOT_HOST: '%'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      # Halved from the base stack: staging runs two databases on one host, and
      # a soak that OOMs measures the instance rather than the replica.
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-256M}
      - --max-connections=200
      - --slow-query-log=1
      - --long-query-time=1
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON

  mysql-replica:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      MYSQL_ROOT_HOST: '%'
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-256M}
      - --max-connections=200
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      # super_read_only is deliberately NOT a startup flag. The entrypoint's own
      # bootstrap — creating root and setting its password — is a write, so the
      # flag makes first initialisation fail with ERROR 1290 and leaves a
      # database nobody can log into. It is applied by mysql-replica-init with
      # SET PERSIST once the server is up, which survives restarts. Replication
      # applier threads are exempt from it, so replication still works.
    volumes:
      - mysql-replica-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [fip]

  # One-shot, mirroring the minio-init pattern: point the replica at the
  # primary and start it. Safe to re-run — CHANGE REPLICATION SOURCE on an
  # already-configured replica is rejected while it is running, so the guard
  # skips it.
  mysql-replica-init:
    image: mysql:8.4
    depends_on:
      mysql: { condition: service_healthy }
      mysql-replica: { condition: service_healthy }
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
      DB_REPL_USER: ${DB_REPL_USER:-repl}
      DB_REPL_PASSWORD: ${DB_REPL_PASSWORD:?DB_REPL_PASSWORD must be set}
    volumes:
      - ./scripts/replica-init.sh:/replica-init.sh:ro
    entrypoint: ['/bin/sh', '/replica-init.sh']
    networks: [fip]

  # The three PHP services read from the replica. DB_READ_HOST is set here
  # rather than in .env so that bringing the stack up without this overlay
  # cannot leave reads pointed at a host that does not exist — the failure mode
  # that broke CI when .env.example hardcoded it.
  api:
    environment:
      DB_READ_HOST: mysql-replica
    depends_on:
      mysql-replica: { condition: service_healthy }

  queue:
    environment:
      DB_READ_HOST: mysql-replica

  scheduler:
    environment:
      DB_READ_HOST: mysql-replica

volumes:
  mysql-replica-data:
