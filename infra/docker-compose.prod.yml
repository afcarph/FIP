# =============================================================================
#  Production overlay.
#
#    docker compose -f infra/docker-compose.yml \
#                   -f infra/docker-compose.prod.yml --env-file .env up -d
#
#  Differences from development: production build targets, no bind mounts, no
#  exposed database ports, no dev tooling, resource limits and log rotation.
# =============================================================================

services:
  mysql:
    ports: []          # reachable only on the internal network
    logging: &logging
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }

  redis:
    ports: []
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  minio:
    # !override, not !reset and not a plain list: a plain list merges with the
    # base rather than replacing it, and !reset empties regardless of the value
    # given. Getting this wrong is why the console it claims to close (9001)
    # was still published, and why the S3 port landed on 0.0.0.0 alongside the
    # base file's loopback binding.
    #
    # Loopback only: nothing outside the host should reach object storage
    # directly. Serving media to clients is nginx's job, or real S3 — which is
    # the documented production path anyway (docs/06 §6.8).
    ports: !override ['127.0.0.1:9000:9000']
    logging: *logging

  api:
    build:
      target: production
    # !reset, not []: Compose merges lists, so an empty list keeps the base
    # file's development bind mounts — production would serve the host's source
    # tree over the built image, with empty anonymous volumes on node_modules
    # and .next.
    volumes: !reset []            # code ships in the image
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2.0', memory: 1G }
      restart_policy:
        condition: on-failure
        max_attempts: 3

  queue:
    build:
      target: production
    # !reset, not []: Compose merges lists, so an empty list keeps the base
    # file's development bind mounts — production would serve the host's source
    # tree over the built image, with empty anonymous volumes on node_modules
    # and .next.
    volumes: !reset []
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      # Two workers: enough headroom that a slow report export never blocks
      # a price alert.
      replicas: 2
      resources:
        limits: { cpus: '1.0', memory: 768M }

  scheduler:
    build:
      target: production
    # !reset, not []: Compose merges lists, so an empty list keeps the base
    # file's development bind mounts — production would serve the host's source
    # tree over the built image, with empty anonymous volumes on node_modules
    # and .next.
    volumes: !reset []
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      # Exactly one — a duplicated scheduler would double every cron run.
      replicas: 1

  ai-service:
    volumes:
      - ai-models:/app/models    # model artefacts persist across deploys
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2.0', memory: 2G }

  web:
    build:
      target: production
    # !reset, not []: Compose merges lists, so an empty list keeps the base
    # file's development bind mounts — production would serve the host's source
    # tree over the built image, with empty anonymous volumes on node_modules
    # and .next.
    volumes: !reset []
    environment:
      NODE_ENV: production
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1.0', memory: 512M }

  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    logging: *logging

  # Development conveniences have no place in production.
  mailhog:
    profiles: ['donotstart']

  minio-init:
    profiles: ['donotstart']

volumes:
  certbot-www:
