# =============================================================================
#  Production overlay.
#
#    docker compose -f infra/docker-compose.yml \
#                   -f infra/docker-compose.prod.yml --env-file .env up -d
#
#  Differences from development: production build targets, no bind mounts, no
#  exposed database ports, no dev tooling, resource limits and log rotation.
# =============================================================================

services:
  mysql:
    ports: []          # reachable only on the internal network
    logging: &logging
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2G }

  redis:
    ports: []
    logging: *logging
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }

  minio:
    ports: ['9000:9000']   # the console stays closed in production
    logging: *logging

  api:
    build:
      target: production
    volumes: []            # code ships in the image
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2.0', memory: 1G }
      restart_policy:
        condition: on-failure
        max_attempts: 3

  queue:
    build:
      target: production
    volumes: []
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      # Two workers: enough headroom that a slow report export never blocks
      # a price alert.
      replicas: 2
      resources:
        limits: { cpus: '1.0', memory: 768M }

  scheduler:
    build:
      target: production
    volumes: []
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      # Exactly one — a duplicated scheduler would double every cron run.
      replicas: 1

  ai-service:
    volumes:
      - ai-models:/app/models    # model artefacts persist across deploys
    environment:
      APP_ENV: production
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '2.0', memory: 2G }

  web:
    build:
      target: production
    volumes: []
    environment:
      NODE_ENV: production
    logging: *logging
    deploy:
      replicas: 2
      resources:
        limits: { cpus: '1.0', memory: 512M }

  nginx:
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    logging: *logging

  # Development conveniences have no place in production.
  mailhog:
    profiles: ['donotstart']

  minio-init:
    profiles: ['donotstart']

volumes:
  certbot-www:
