<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Fuel Intelligence Platform">
  <title>Fuel Intelligence Platform</title>
  <defs>
    <linearGradient id="fip-sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="55%" stop-color="#1d7a5f"/>
      <stop offset="100%" stop-color="#4cae3a"/>
    </linearGradient>
    <linearGradient id="fip-bar-a" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1e60a8"/><stop offset="100%" stop-color="#2f86c9"/>
    </linearGradient>
    <linearGradient id="fip-bar-b" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a7a86"/><stop offset="100%" stop-color="#20a07a"/>
    </linearGradient>
    <linearGradient id="fip-bar-c" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2f9a4e"/><stop offset="100%" stop-color="#6cbf3f"/>
    </linearGradient>
  </defs>

  <!-- The droplet, as two strokes meeting at the apex: navy rising on the
       left, green falling on the right, so one teardrop carries the gradient
       the rest of the brand uses. -->
  <path d="M256 44 C 198 134 154 198 154 262 a 102 102 0 0 0 22 63"
        fill="none" stroke="#1e3a5f" stroke-width="26" stroke-linecap="round"/>
  <path d="M256 44 C 314 134 358 198 358 262 a 102 102 0 0 1 -21 62"
        fill="none" stroke="#4cae3a" stroke-width="26" stroke-linecap="round"/>

  <!-- Bars: the "analyze" half of the promise. -->
  <rect x="222" y="298" width="34" height="80" rx="6" fill="url(#fip-bar-a)"/>
  <rect x="266" y="264" width="34" height="114" rx="6" fill="url(#fip-bar-b)"/>
  <rect x="310" y="226" width="34" height="152" rx="6" fill="url(#fip-bar-c)"/>

  <!-- The nozzle: compact grip, long thin spout, one silhouette. Kept small
       and to the left so the bars stay legible behind it — an emblem that has
       to be large to be readable is no use as a favicon. -->
  <g transform="translate(178 226) rotate(-30) scale(0.78)">
    <path d="M16 0 h54 a10 10 0 0 1 10 10 v14 h62 a9 9 0 0 1 9 9 v4
             a9 9 0 0 1 -9 9 h-62 v14 a10 10 0 0 1 -10 10 h-10 v34
             a16 16 0 0 1 -16 16 h-28 a16 16 0 0 1 -16 -16 v-88
             a16 16 0 0 1 16 -16 z"
          fill="#1e3a5f"/>
    <rect x="6" y="52" width="30" height="9" rx="4.5" fill="#4cae3a"/>
    <path d="M2 116 c -12 24 -34 34 -62 32"
          fill="none" stroke="#1e3a5f" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- The rising trend, drawn last so it crosses the droplet's lower curve.
       The arrowhead is rotated onto the path's own tangent at its end, rather
       than dropped near it. -->
  <path d="M116 372 C 178 446 302 452 388 366"
        fill="none" stroke="url(#fip-sweep)" stroke-width="30" stroke-linecap="butt"/>
  <path d="M0 -26 L 30 0 L 0 26 Z" fill="#4cae3a"
        transform="translate(388 366) rotate(-45)"/>
</svg>
