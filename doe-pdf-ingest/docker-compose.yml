# One-command deployment:  docker compose up -d
#
# The ingest writes to the platform's database. There is no database of its own
# to start: `fuel_reports`, `fuel_prices` and `doe_import_runs` are created by
# Laravel's migrations, and this service only writes rows into them.

name: fip-doe-ingest

services:
  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DOE_DB_HOST: ${DOE_DB_HOST:?set DOE_DB_HOST in .env}
      DOE_DB_PORT: ${DOE_DB_PORT:-3306}
      DOE_DB_NAME: ${DOE_DB_NAME:-fip}
      DOE_DB_USER: ${DOE_DB_USER:-fip}
      DOE_DB_PASSWORD: ${DOE_DB_PASSWORD:?set DOE_DB_PASSWORD in .env}
      DOE_PORTAL_BASE_URL: ${DOE_PORTAL_BASE_URL:-https://doe.gov.ph}
      DOE_CMS_BASE_URL: ${DOE_CMS_BASE_URL:-https://prod-cms.doe.gov.ph}
      DOE_SCHEDULE_HOUR: ${DOE_SCHEDULE_HOUR:-6}
      DOE_SCHEDULE_MINUTE: ${DOE_SCHEDULE_MINUTE:-0}
      DOE_TIMEZONE: ${DOE_TIMEZONE:-Asia/Manila}
      DOE_LOG_LEVEL: ${DOE_LOG_LEVEL:-INFO}
      DOE_LOG_JSON: ${DOE_LOG_JSON:-false}
      DOE_NOTIFY_WEBHOOK_URL: ${DOE_NOTIFY_WEBHOOK_URL:-}
    # The container's own user owns /app, but the two directories it writes to
    # are bind-mounted from the host and owned there. Running as the host's
    # owner is what lets an operator read the logs and back the archive up
    # without sudo.
    user: "${DOE_UID:-10001}:${DOE_GID:-10001}"
    volumes:
      - ${DOE_LOG_DIR:-./logs}:/app/logs
      # The archive, bind-mounted from a directory outside any application
      # checkout and covered by the nightly snapshot job. A named volume was
      # safe from a container rebuild and invisible to the backup — and these
      # PDFs are the only way to re-extract a past week, because the DOE keeps
      # no accessible archive of superseded publications.
      - ${DOE_ARCHIVE_DIR:-./storage/pdfs}:/app/storage/pdfs
    # Reaches the platform's MySQL, which runs in the main compose project.
    networks:
      - fip

networks:
  fip:
    external: true
    name: ${FIP_NETWORK:-fip_fip}
